<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Terminal session: whoami — Mohamed Amiin, full-stack developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7ee787"/>
      <stop offset=".5"  stop-color="#79c0ff"/>
      <stop offset="1"   stop-color="#d2a8ff"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="878" height="266" rx="12"/></clipPath>
    <clipPath id="c1"><rect class="type t1" x="32" y="80" height="22" width="0"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="32" y="140" height="22" width="0"/></clipPath>
    <clipPath id="c3"><rect class="type t3" x="32" y="200" height="22" width="0"/></clipPath>
    <style>
      .type { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: steps(24, end); }
      .out  { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; }
      .t1 { animation-name: t1 } .t2 { animation-name: t2 } .t3 { animation-name: t3 }
      .o1 { animation-name: o1 } .o2 { animation-name: o2 } .o3 { animation-name: o3 }
      @keyframes t1 { 0%,2%   { width: 0 } 10%,100% { width: 176px } }
      @keyframes t2 { 0%,16%  { width: 0 } 26%,100% { width: 236px } }
      @keyframes t3 { 0%,32%  { width: 0 } 40%,100% { width: 176px } }
      @keyframes o1 { 0%,11%  { opacity: 0 } 13%,100% { opacity: 1 } }
      @keyframes o2 { 0%,27%  { opacity: 0 } 29%,100% { opacity: 1 } }
      @keyframes o3 { 0%,41%  { opacity: 0 } 43%,100% { opacity: 1 } }
      .cursor { animation: blink 16s infinite; }
      @keyframes blink {
        0%,42% { opacity: 0 }
        43%,50% { opacity: 1 } 51%,58% { opacity: 0 }
        59%,66% { opacity: 1 } 67%,74% { opacity: 0 }
        75%,82% { opacity: 1 } 83%,90% { opacity: 0 }
        91%,98% { opacity: 1 } 99%,100% { opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        .type { width: 380px; animation: none } .out { opacity: 1; animation: none } .cursor { opacity: 1; animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="268" fill="#0d1117"/>
    <rect width="880" height="40" fill="#161b22"/>
    <rect width="880" height="3" fill="url(#accent)"/>
    <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="21" r="6" fill="#27c93f"/>
    <text x="440" y="26" fill="#6e7681" font-size="12" text-anchor="middle">amiin@dev — zsh — 80×24</text>
  </g>
  <rect x=".5" y=".5" width="879" height="267" rx="12" fill="none" stroke="#30363d"/>

  <g font-size="14">
    <g clip-path="url(#c1)">
      <text x="32" y="96"><tspan fill="#7ee787">amiin@dev</tspan><tspan fill="#6e7681"> ~ </tspan><tspan fill="#79c0ff">%</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    </g>
    <text class="out o1" x="32" y="122" fill="#e6edf3">Mohamed Amiin <tspan fill="#6e7681">·</tspan> <tspan fill="#d2a8ff">full-stack developer</tspan></text>

    <g clip-path="url(#c2)">
      <text x="32" y="156"><tspan fill="#7ee787">amiin@dev</tspan><tspan fill="#6e7681"> ~ </tspan><tspan fill="#79c0ff">%</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
    </g>
    <text class="out o2" x="32" y="182" fill="#a5d6ff">typescript <tspan fill="#6e7681">·</tspan> swift <tspan fill="#6e7681">·</tspan> kotlin <tspan fill="#6e7681">·</tspan> go <tspan fill="#6e7681">·</tspan> whatever the problem needs</text>

    <g clip-path="url(#c3)">
      <text x="32" y="216"><tspan fill="#7ee787">amiin@dev</tspan><tspan fill="#6e7681"> ~ </tspan><tspan fill="#79c0ff">%</tspan><tspan fill="#e6edf3"> uptime</tspan></text>
    </g>
    <g class="out o3">
      <text x="32" y="242" fill="#e6edf3">web <tspan fill="#6e7681">→</tspan> mobile <tspan fill="#6e7681">→</tspan> back again <tspan fill="#6e7681">·</tspan> load average: <tspan fill="#ffa657">caffeinated</tspan></text>
    </g>
    <rect class="cursor" x="478" y="230" width="8" height="15" fill="#7ee787"/>
  </g>
</svg>
