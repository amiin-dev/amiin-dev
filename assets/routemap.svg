    <line x1="680" y1="56" x2="680" y2="238"/>
    <line x1="780" y1="56" x2="780" y2="238"/>

    <line x1="24" y1="90" x2="856" y2="90"/>
    <line x1="24" y1="150" x2="856" y2="150"/>
    <line x1="24" y1="210" x2="856" y2="210"/>
  </g>

  <!-- Header -->
  <text
    x="28"
    y="34"
