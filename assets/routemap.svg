```xml
<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="880"
  height="266"
  viewBox="0 0 880 266"
  font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Developer route map from idea to design to build, branching into web, mobile and API, then arriving at shipped"
  onload="setCurrentYear()"
>

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="5"
        flood-color="#0b2545"
        flood-opacity="0.10"
      />
    </filter>

    <style>
      text {
        font-family:
          Inter,
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
      }

      .leg {
        fill: none;
        stroke: #f97316;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 7 9;
        animation: fly 1.4s linear infinite;
      }

      .branch {
        fill: none;
        stroke: #98a2b3;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-dasharray: 5 7;
        animation: fly 2s linear infinite;
      }

      .loop {
        fill: none;
        stroke: #0b2545;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-dasharray: 2 7;
        opacity: 0.34;
        animation: fly 3s linear infinite reverse;
      }

      .code {
        fill: #101828;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .description {
        fill: #7c8794;
        font-size: 10.5px;
      }

      .tech {
        fill: #667085;
        font-size: 9.5px;
        font-weight: 600;
      }

      @keyframes fly {
        to {
          stroke-dashoffset: -16;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .leg,
        .branch,
        .loop {
          animation: none;
        }
      }
    </style>

  </defs>

  <!-- Card shadow -->
  <rect
    x="4"
    y="4"
    width="872"
    height="258"
    rx="16"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="878"
    height="264"
    rx="16"
    fill="url(#background)"
    stroke="#d0d9e4"
    stroke-width="1.4"
  />

  <!-- Accent -->
  <rect
    x="1"
    y="1"
    width="878"
    height="3"
    rx="1.5"
    fill="url(#accent)"
  />

  <!-- Very subtle grid -->
  <g
    stroke="#edf1f5"
    stroke-width="1"
    opacity="0.65"
  >
    <line x1="80" y1="56" x2="80" y2="238"/>
    <line x1="180" y1="56" x2="180" y2="238"/>
    <line x1="280" y1="56" x2="280" y2="238"/>
    <line x1="380" y1="56" x2="380" y2="238"/>
