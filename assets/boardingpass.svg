<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="880"
  height="300"
  viewBox="0 0 880 300"
  role="img"
  aria-label="Amiin Airways developer boarding pass"
  onload="setCurrentYear()"
>

  <defs>

    <!-- Background -->
    <linearGradient id="ticketBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fb"/>
    </linearGradient>

    <!-- Header -->
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#071a33"/>
      <stop offset="100%" stop-color="#123b68"/>
    </linearGradient>

    <!-- Orange accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Ticket clipping -->
    <clipPath id="ticketClip">
      <rect
        x="1"
        y="1"
        width="878"
        height="298"
        rx="18"
        ry="18"
      />
    </clipPath>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="6"
        flood-color="#0b2545"
        flood-opacity="0.14"
      />
    </filter>

    <!-- Route -->
    <path
      id="route"
      d="M145,119 Q330,48 520,119"
    />

    <style>
      text {
        font-family:
          Inter,
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
      }

      .label {
        fill: #7b8794;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.6px;
      }

      .value {
        fill: #101828;
        font-weight: 700;
      }

      .muted {
        fill: #98a2b3;
      }

      .route-line {
        stroke-dasharray: 7 8;
        animation: dash 1.3s linear infinite;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .route-line {
          animation: none;
        }
      }
    </style>

  </defs>

  <!-- Card shadow -->
  <rect
    x="4"
    y="4"
    width="872"
    height="292"
    rx="18"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <g clip-path="url(#ticketClip)">

    <!-- Main background -->
    <rect
      width="880"
      height="300"
      fill="url(#ticketBg)"
    />

    <!-- Stub background -->
    <rect
      x="660"
      y="0"
      width="220"
      height="300"
      fill="#f1f5f9"
    />

    <!-- Header -->
    <rect
      width="880"
      height="58"
      fill="url(#headerBg)"
    />

    <!-- Orange accent -->
    <rect
      x="0"
      y="58"
      width="880"
      height="3"
      fill="url(#accent)"
    />

  </g>

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="878"
    height="298"
    rx="18"
    fill="none"
    stroke="#d0d9e4"
    stroke-width="1.4"
  />

  <!-- Tear line -->
  <line
    x1="660"
    y1="72"
    x2="660"
    y2="282"
    stroke="#c5ced8"
    stroke-width="1.4"
    stroke-dasharray="5 6"
  />

  <!-- ====================== -->
  <!-- HEADER -->
  <!-- ====================== -->

  <!-- Brand icon -->
  <circle
    cx="31"
    cy="29"
    r="15"
    fill="#ffffff"
    fill-opacity="0.1"
  />

  <path
    d="M21 29 L40 21 L34 29 L40 37 Z"
    fill="#fb923c"
  />

  <text
    x="55"
    y="35"
    fill="#ffffff"
    font-size="18"
    font-weight="800"
    letter-spacing="3.2"
  >
    AMIIN AIRWAYS
  </text>

  <text
    x="630"
    y="34"
    fill="#8fb4da"
    font-size="10"
    font-weight="700"
    letter-spacing="2.7"
    text-anchor="end"
  >
    DEVELOPER BOARDING PASS
  </text>

  <text
    x="850"
    y="34"
    fill="#8fb4da"
    font-size="10"
    font-weight="700"
    letter-spacing="2.7"
    text-anchor="end"
  >
    FLIGHT STUB
  </text>

  <!-- ====================== -->
  <!-- ROUTE -->
  <!-- ====================== -->

  <text
    class="label"
    x="28"
    y="88"
  >
    FROM
  </text>

  <text
    class="label"
    x="550"
    y="88"
  >
    TO
  </text>

  <text
    x="28"
    y="126"
    class="value"
    font-size="38"
    letter-spacing="1"
  >
    IDA
  </text>

  <text
    x="550"
    y="126"
    class="value"
    font-size="38"
    letter-spacing="1"
  >
    SHP
  </text>

  <text
    x="29"
    y="145"
    font-size="11"
    fill="#98a2b3"
  >
    IDEA
  </text>

  <text
    x="551"
    y="145"
    font-size="11"
    fill="#98a2b3"
  >
    SHIPPED
  </text>

  <!-- Route line -->
  <use
    href="#route"
    fill="none"
    stroke="#f97316"
    stroke-width="2.4"
    stroke-linecap="round"
    class="route-line"
  />

  <!-- Departure -->
  <circle
    cx="145"
    cy="119"
    r="5"
    fill="#ffffff"
    stroke="#0b2545"
    stroke-width="3"
  />

  <!-- Destination -->
  <circle
    cx="520"
    cy="119"
    r="5"
    fill="#ffffff"
    stroke="#0b2545"
    stroke-width="3"
  />

  <!-- Flying plane -->
  <g fill="#f97316">
    <path d="M-4,-7 L17,0 L-4,7 L1,0 Z">
      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        rotate="auto"
      >
        <mpath href="#route"/>
      </animateMotion>
    </path>
  </g>

  <!-- ====================== -->
  <!-- PASSENGER INFORMATION -->
  <!-- ====================== -->

  <line
    x1="28"
    y1="165"
    x2="630"
    y2="165"
    stroke="#e4e9ef"
  />

  <!-- Passenger -->

  <text class="label" x="28" y="187">
    PASSENGER
  </text>

  <text
    class="value"
    x="28"
    y="210"
    font-size="15"
  >
    MOHAMED AMIN
  </text>

  <!-- Class -->

  <text class="label" x="218" y="187">
    CLASS
  </text>

  <text
    class="value"
    x="218"
    y="210"
    font-size="15"
  >
    FULL-STACK
  </text>

  <!-- Flight -->

  <text class="label" x="384" y="187">
    FLIGHT
  </text>

  <text
    class="value"
    x="384"
    y="210"
    font-size="15"
  >
    AM <tspan class="current-year">2026</tspan>
  </text>

  <!-- Gate -->

  <text class="label" x="510" y="187">
    GATE
  </text>

  <text
    class="value"
    x="510"
    y="210"
    font-size="15"
  >
    MAIN
  </text>

  <!-- ====================== -->
  <!-- TECH STACK -->
  <!-- ====================== -->

  <text class="label" x="28" y="238">
    CARRY-ON
  </text>

  <!-- Stack pills -->

  <g transform="translate(28 248)">

    <rect
      width="76"
      height="26"
      rx="13"
      fill="#eef2f7"
    />

    <text
      x="38"
      y="17"
      text-anchor="middle"
      font-size="10"
      font-weight="700"
      fill="#344054"
    >
      TYPESCRIPT
    </text>

  </g>

  <g transform="translate(111 248)">

    <rect
      width="52"
      height="26"
      rx="13"
      fill="#eef2f7"
    />

    <text
      x="26"
      y="17"
      text-anchor="middle"
      font-size="10"
      font-weight="700"
      fill="#344054"
    >
      EXPO
    </text>

  </g>

  <g transform="translate(170 248)">

    <rect
      width="69"
      height="26"
      rx="13"
      fill="#eef2f7"
    />

    <text
      x="34.5"
      y="17"
      text-anchor="middle"
      font-size="10"
      font-weight="700"
      fill="#344054"
    >
      EXPRESS
    </text>

  </g>

  <g transform="translate(246 248)">

    <rect
      width="44"
      height="26"
      rx="13"
      fill="#eef2f7"
    />

    <text
      x="22"
      y="17"
      text-anchor="middle"
      font-size="10"
      font-weight="700"
      fill="#344054"
    >
      GO
    </text>

  </g>

  <g transform="translate(297 248)">

    <rect
      width="54"
      height="26"
      rx="13"
      fill="#eef2f7"
    />

    <text
      x="27"
      y="17"
      text-anchor="middle"
      font-size="10"
      font-weight="700"
      fill="#344054"
    >
      NEST
    </text>

  </g>

  <!-- ====================== -->
  <!-- STATUS -->
  <!-- ====================== -->

  <text class="label" x="500" y="238">
    STATUS
  </text>

  <g transform="translate(500 248)">

    <rect
      width="103"
      height="27"
      rx="13.5"
      fill="#eaf8ee"
    />

    <circle
      cx="16"
      cy="13.5"
      r="4"
      fill="#22a447"
    />

    <text
      x="29"
      y="17"
      font-size="10"
      font-weight="800"
      fill="#187b35"
      letter-spacing=".6"
    >
      ON TIME
    </text>

  </g>

  <!-- ====================== -->
  <!-- STUB -->
  <!-- ====================== -->

  <text
    class="label"
    x="684"
    y="91"
  >
    FLIGHT
  </text>

  <text
    x="684"
    y="117"
    class="value"
    font-size="21"
  >
    AM <tspan class="current-year">2026</tspan>
  </text>

  <!-- Seat -->

  <text
    class="label"
    x="684"
    y="151"
  >
    SEAT
  </text>

  <text
    class="value"
    x="684"
    y="179"
    font-size="23"
  >
    1A
  </text>

  <!-- Boards -->

  <text
    class="label"
    x="788"
    y="151"
  >
    BOARDS
  </text>

  <text
    class="value"
    x="788"
    y="179"
    font-size="18"
  >
    DAILY
  </text>

  <!-- Stub separator -->

  <line
    x1="684"
    y1="192"
    x2="852"
    y2="192"
    stroke="#d9e0e8"
  />

  <!-- Barcode -->

  <g
    fill="#101828"
    transform="translate(684 208)"
  >

    <rect x="0" width="2" height="48"/>
    <rect x="5" width="5" height="48"/>
    <rect x="13" width="2" height="48"/>
    <rect x="18" width="6" height="48"/>
    <rect x="27" width="3" height="48"/>
    <rect x="34" width="2" height="48"/>
    <rect x="39" width="5" height="48"/>
    <rect x="47" width="2" height="48"/>
    <rect x="53" width="3" height="48"/>
    <rect x="60" width="6" height="48"/>
    <rect x="70" width="2" height="48"/>
    <rect x="75" width="4" height="48"/>
    <rect x="83" width="2" height="48"/>
    <rect x="88" width="6" height="48"/>
    <rect x="98" width="3" height="48"/>
    <rect x="105" width="2" height="48"/>
    <rect x="110" width="5" height="48"/>
    <rect x="119" width="3" height="48"/>
    <rect x="126" width="6" height="48"/>
    <rect x="136" width="2" height="48"/>
    <rect x="141" width="4" height="48"/>
    <rect x="149" width="2" height="48"/>
    <rect x="154" width="6" height="48"/>
    <rect x="164" width="3" height="48"/>

  </g>

  <text
    x="852"
    y="277"
    text-anchor="end"
    fill="#98a2b3"
    font-size="8.5"
    font-weight="700"
    letter-spacing="1.4"
  >
    NO CHECKED BAGGAGE
  </text>

  <!-- Dynamic current year -->
  <script type="application/ecmascript">
    <![CDATA[

      function setCurrentYear() {

        var year = new Date().getFullYear();

        var elements =
          document.getElementsByClassName("current-year");

        for (
          var i = 0;
          i < elements.length;
          i++
        ) {

          elements[i].textContent = year;

        }

      }

    ]]>
  </script>

</svg>
