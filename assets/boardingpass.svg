<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="880"
  height="300"
  viewBox="0 0 880 300"
  font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Boarding pass: passenger Mohamed Amiin, class full-stack, from IDEA to SHIPPED"
  onload="setCurrentYear()"
>

  <defs>
    <clipPath id="ticket">
      <path d="M 15,1 H 648 A 12,12 0 0 1 672,1 H 865 A 14,14 0 0 1 879,15 V 285 A 14,14 0 0 1 865,299 H 672 A 12,12 0 0 1 648,299 H 15 A 14,14 0 0 1 1,285 V 15 A 14,14 0 0 1 15,1 Z"/>
    </clipPath>

    <path id="route" d="M132,116 Q322,62 512,116"/>

    <style>
      .dashes {
        stroke-dasharray: 7 9;
        animation: fly 1.4s linear infinite;
      }

      @keyframes fly {
        to {
          stroke-dashoffset: -16;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dashes {
          animation: none;
        }
      }
    </style>
  </defs>

